services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:5.2.0
    container_name: seans-worker-qbit
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Moscow
      - WEBUI_PORT=8080
      - TORRENTING_PORT=6881
    ports:
      - "6881:6881"
      - "6881:6881/udp"
      # Web UI только на localhost — http://localhost:8080
      - "127.0.0.1:8080:8080"
    volumes:
      - ./docker/qbit-config:/config
      - ${STAGING_HOST_DIR:-/mnt/staging}:/downloads
    restart: unless-stopped
    mem_limit: 1g
    # WebUI answers 200 on / once qBittorrent is fully up (API itself needs auth).
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    container_name: seans-worker-caddy
    ports:
      - "80:80"
      - "443:443"
    environment:
      WORKER_NAME: ${WORKER_NAME:-worker}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
    depends_on:
      qbittorrent:
        condition: service_healthy

  agent:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: seans-worker-agent
    env_file: .env
    volumes:
      - ${STAGING_HOST_DIR:-/mnt/staging}:/staging
      - agent-state:/state
    restart: unless-stopped
    mem_limit: 128m
    depends_on:
      qbittorrent:
        condition: service_healthy

volumes:
  agent-state:
  caddy-data:
  caddy-config: